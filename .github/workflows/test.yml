name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run unit-test

      - name: Run XSS / regression tests on the overlay page
        run: npm run xss-test

      - name: Apply migrations to a local D1 database
        run: |
          npm run db:migrate:local

      - name: Start the Worker (background)
        run: |
          # The smoke test signs its fake Telegram logins with this exact
          # token (see BOT_TOKEN in scripts/smoke-test.mjs), so the Worker has
          # to verify with the same one. Do NOT use .dev.vars.example here --
          # its placeholder token differs, which made every login return 401
          # and kept this job failing since it was introduced.
          printf 'TELEGRAM_BOT_TOKEN=1234567890:TEST_TOKEN_FOR_LOCAL_SMOKE_TEST_ONLY\nTELEGRAM_BOT_USERNAME=smoke_test_bot\n' > .dev.vars
          nohup npx wrangler dev --port 8787 > wrangler.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s http://localhost:8787/api/health && break
            sleep 1
          done

      - name: Run smoke tests
        run: node scripts/smoke-test.mjs

      - name: Show Worker logs on failure
        if: failure()
        run: cat wrangler.log
